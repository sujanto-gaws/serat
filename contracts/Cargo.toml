# The contracts crate exists so that contracts/ipc.rs is compiled and its
# TypeScript is generated by the ordinary `cargo test --workspace` run.
#
# Without it, ipc.rs is a file nothing builds: a syntax error, a dropped derive
# or a type ts-rs cannot handle would sit undetected until serat-app tried to
# include it. A contract whose header says "this is a contract, not a sketch"
# has to be held to that by the build rather than by review (NFR-MNT-01,
# ADR-0007). Raised as S1 in code-reviewer's D3 review.
#
# It takes no internal dependency and never will. serat-app includes ipc.rs as
# its own module; this crate exists to compile and export it, not to be linked.
[package]
name = "serat-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
ts-rs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
