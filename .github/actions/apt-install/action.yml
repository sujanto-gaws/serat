name: apt-install
description: >
  Install Ubuntu packages without depending on third-party apt sources the hosted runner
  image carries (task #228, NFR-MNT-01, NFR-PRF-08: a red gate must mean a Serat defect).
  Removes every sources.list.d entry that is not the Ubuntu archive, then apt-get update
  (one retry) and apt-get install.
inputs:
  packages:
    description: Space-separated list of apt packages to install.
    required: true
runs:
  using: composite
  steps:
    - name: Drop third-party apt sources, update, install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # SOURCES_DIR and SUDO are overridable only so the logic can be exercised locally.
        dir="${SOURCES_DIR:-/etc/apt/sources.list.d}"
        sudo_cmd="${SUDO-sudo}"
        # Serat needs only the Ubuntu archive (ubuntu.sources / ubuntu.list only; PPA-style ubuntu-* files are removed). Anything else
        # (microsoft-prod, azure-cli, google-chrome, github-cli, ...) is a runner-image extra
        # whose outage or signing change must not fail our gate.
        shopt -s nullglob
        for f in "$dir"/*.list "$dir"/*.sources; do
          case "$(basename "$f")" in
            ubuntu.sources|ubuntu.list) ;;
            *) echo "apt-install: removing third-party source $f"; $sudo_cmd rm -f -- "$f" ;;
          esac
        done
        $sudo_cmd apt-get update || { echo "apt-install: apt-get update failed, retrying once"; sleep 5; $sudo_cmd apt-get update; }
        read -ra pkgs <<<"$PACKAGES"
        $sudo_cmd apt-get install -y -- "${pkgs[@]}"
