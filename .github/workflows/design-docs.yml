# Design-document path check — F-239, F-238, NFR-MNT-01. See
# docs/05-testing/design-doc-paths.md.
#
# A citation to a file that is not there reads as complete and stops anyone
# from looking. This job makes that mechanical: every path the design
# documents cite as fact must resolve, unless the document marks it
# `*(planned)*`. It is a plain `cargo test`, not release-profile timed work,
# so it runs on every push and PR rather than only on a schedule.
#
# Owner: test-engineer.

name: design-docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  design-doc-paths:
    name: "F-239 · every cited design-doc path resolves or is marked planned"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-design-paths
