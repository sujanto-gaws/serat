# Design-document consistency checks — F-239, F-238, F-303, F-346, F-348,
# NFR-MNT-01. See docs/05-testing/design-doc-paths.md.
#
# A citation to a file that is not there reads as complete and stops anyone
# from looking, and so does a table whose claim depends on a file it does not
# live in, and so does a table that no longer renders as a table at all. All
# three jobs are mechanical for that reason: `cargo test -p doclint` covers
# all of them (they are one crate), and each job also prints its own report so
# a failure names which check failed without anyone reading a log. Plain
# `cargo test`, not release-profile timed work, so this runs on every push and
# PR rather than only on a schedule.
#
# Owner: test-engineer.

name: design-docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  design-doc-paths:
    name: "F-239 · every cited design-doc path resolves or is marked planned"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-design-paths

  prd-architecture-join:
    name: "F-303 · every PRD Must is accounted for in architecture.md, and vice versa"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-prd-join

  table-structure:
    name: "F-346/F-348 · every table in the design docs renders as a table"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-table-structure

  count-over-list:
    name: "F-496 · a count written above a list matches the list"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-count-over-list

  conflict-markers:
    name: "NFR-MNT-01 · no document carries an unresolved conflict marker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p doclint
      - name: Print the report either way
        if: always()
        run: cargo run -p doclint --bin check-conflict-markers
