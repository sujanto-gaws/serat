# Performance budgets — NFR-PRF-08, US-35, C-06.
#
# "Every performance budget shall be asserted in continuous integration; a
# regression shall fail the build." One job per budget, so a failure names the
# requirement it broke instead of saying "benchmarks failed".
#
# Runner-side scheduling has been unavailable since 2026-09-06 (F-384, RISK-013: every
# run completes in 1-4s with zero steps, consistent with exhausted included Actions
# minutes), which needs the repository owner, not a code change. A budget job that
# skips when the thing it measures is absent is worse than no job at all: the build
# goes green and nobody notices the budget is unasserted. So the three jobs that
# drive the application need the `build-app` job (the release serat-app, built once
# and downloaded); a bin that still finds no binary exits 3 with one line and no
# verdict (task #164), and `budgets-gate` below turns any skipped or failed job red.
#
# Owner: test-engineer. Thresholds live in bench/budget/src/lib.rs next to the
# requirement they come from, and are never weakened to make a build pass — a
# budget that is genuinely wrong is re-baselined in the PRD (task Q1) with the
# measurement attached.

name: budgets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A budget measured in a debug build is not a measurement.
  #
  # RULE: release builds are per package (`-p`), NEVER `--workspace`. budget links
  # serat-index with its `test-hooks` feature, and a workspace-wide build unifies
  # that feature into serat-app, whose const assert (crates/serat-app/src/lib.rs)
  # then refuses to compile a release build carrying test hooks. Debug is
  # unaffected. Every command in this file is already `-p`-scoped; keep it so. The
  # `serat-app-release-guard` job below exercises the guard (task #54, NFR-MNT-01).
  CARGO_PROFILE: release

jobs:
  # The test-hooks guard, exercised: serat-app built alone in release must compile,
  # i.e. nothing in ITS graph turns `test-hooks` on. If someone adds the feature to
  # serat-app's own dependency edge, this fails here rather than at release time.
  # Independent of `vault`, cheap, and runs on every PR and every push to main.
  serat-app-release-guard:
    name: "serat-app builds in release without test-hooks"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p serat-app --release
      # The other direction: with test-hooks forced on, the same build MUST fail, and
      # fail on the guard's own message (not on some unrelated error). If this step
      # passes the assert is dead and the first step proves nothing.
      - name: The guard fires when test-hooks is unified in
        shell: bash
        run: |
          if out=$(cargo check -p serat-app --release --features serat-index/test-hooks 2>&1); then
            echo "$out"
            echo "::error::serat-app built in release with test-hooks on; the const assert is not firing"
            exit 1
          fi
          echo "$out" | grep -q "test-hooks must not reach a release build" || {
            echo "$out"
            echo "::error::the build failed, but not on the test-hooks guard"
            exit 1
          }

  # NFR-MNT-02: the vault is generated from one command and is byte-identical.
  # Everything below is measured against it, so if this fails the other jobs
  # are measuring something unknown and are not worth running.
  vault:
    name: "NFR-MNT-02 · benchmark vault is deterministic"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault
        run: cargo run --release -p vaultgen -- --preset 20k --force
      - name: Regenerate and assert the digest is unchanged
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Generator tests
        run: cargo test --release -p vaultgen

  # Task #164 (NFR-PRF-01, NFR-PRF-03, NFR-PRF-08, C-06). The three jobs that DRIVE the
  # application (prf01-serat-term, prf01-cold-start, prf03-save-to-index) spawn
  # target/release/serat.exe; `cargo run -p budget` builds the harness, never the app, so
  # until this job existed all three failed with "there is no application to start" and
  # measured nothing (runs 279-316). It is built ONCE here and handed to the three as an
  # artifact: one compile of the Tauri crate instead of three, and all three budgets measure
  # the byte-identical binary (NFR-PRF-08: the numbers are comparable). The cost is one
  # upload/download of ~25 MB and a serial step before the three start; a per-job build
  # would have run in parallel but paid the Tauri compile three times on a cold cache.
  #
  # `-p serat-app` and nothing else, per the RULE in `env:` above: no test-hooks, so this is
  # the same graph serat-app-release-guard checks, and the const assert in
  # crates/serat-app/src/lib.rs would refuse the build if that ever changed. A budget bin
  # that finds no binary exits 3 and prints no verdict (bench/budget, EXIT_APP_ABSENT), so
  # a skipped or failed download can never read as a measurement.
  build-app:
    name: "serat-app release binary for the app-driving budgets (no test-hooks)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build serat-app (release, no test-hooks)
        run: cargo build --release -p serat-app
      - name: The binary exists where the budget bins look for it
        shell: bash
        run: test -s target/release/serat.exe
      - uses: actions/upload-artifact@v4
        with:
          name: serat-app-release
          path: target/release/serat.exe
          if-no-files-found: error
          retention-days: 7

  # REPORT-ONLY ON A HOSTED RUNNER (ADR-0019, task #166, NFR-PRF-04, NFR-PRF-08, C-06, RISK-012).
  # NFR-PRF-04's 30 s is the reference machine's number and this budget has no CI regression
  # ceiling. A hosted windows-latest runner has the real-time scanner OFF in all 36 runs on
  # record (279-316; 2 cores is context, the criterion is the scanner), so the harness's own
  # `gate_eligible` is false there and it prints NOT A GATE NUMBER. If GitHub ever turns
  # Defender on for this image the job silently starts asserting 30 s on 2 cores: re-read
  # nfr-prf-04-gate-quality.md first. The bin declares the budget `CiAssertion::WhenGateEligible`:
  # under `--profile ci` on such a runner it measures, prints `REPORT-ONLY`, uploads the
  # JSON and exits 0; on an eligible runner (Linux, or Windows with the scanner on) the same
  # command asserts 30 s and exits 1 on a breach. A measurement that cannot be taken still
  # exits non-zero here (no `continue-on-error`, no `|| true`), so this job is red when the
  # rebuild breaks, not when the runner is slow. The assertion is on the reference machine:
  # `cargo run --release -p budget --bin prf04-full-rebuild -- --profile reference`, at each
  # gate (docs/05-testing/nfr-prf-04-gate-quality.md, "Task #166"). `every-budget-has-a-job`
  # pins that this job's name says so.
  prf04-full-rebuild:
    name: "NFR-PRF-04 · full rebuild of 20k notes < 30 s (report-only on hosted windows; asserted on the reference machine)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p budget --bin prf04-full-rebuild -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf04-full-rebuild
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf03-save-to-index:
    name: "NFR-PRF-03 · save to index < 50 ms p95 over 1000 saves"
    needs: [vault, build-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: serat-app-release
          path: target/release
      - name: The application binary is in place
        shell: bash
        run: test -s target/release/serat.exe
      - run: cargo run --release -p budget --bin prf03-save-to-index -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf03-save-to-index
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf01-cold-start:
    name: "NFR-PRF-01 · scale independence on the Serat term; the two aggregates reported"
    # Task #118 landed: the PRD is the source of truth for what is gated, and
    # PRD v1.2 gates only the Serat term for NFR-PRF-01 (prf01-serat-term,
    # below). window_visible and vault_usable are measured, validated, printed
    # and uploaded by this job and gate nothing -- F-407 measured the aggregate
    # moving ~19% batch-to-batch against ~8% for the Serat term, so it cannot
    # decide a pass at any threshold, and F-443 is the gap between that fact
    # and what CI used to assert.
    #
    # This job is still required, and not as a formality: architecture §3.4's
    # scale-independence check is its remaining assertion, and it fails the
    # build. §3.4's #118 ruling moved that check's subject from
    # window_visible_ms to the Serat term and kept the job here, because
    # prf01-serat-term is a second reduction of one batch of traces while this
    # is a second measurement -- two vaults, interleaved, with the 50,000-note
    # fixture in it (F-446). Removing this job would silently delete the only
    # assertion that vault size does not move the critical path.
    needs: [vault, build-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: serat-app-release
          path: target/release
      - name: The application binary is in place
        shell: bash
        run: test -s target/release/serat.exe
      - run: cargo run --release -p budget --bin prf01-cold-start -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf01-cold-start
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf01-serat-term:
    name: "NFR-PRF-01 · Serat term < 350 ms p95 (task #104's binding gate)"
    needs: [vault, build-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: serat-app-release
          path: target/release
      - name: The application binary is in place
        shell: bash
        run: test -s target/release/serat.exe
      - run: cargo run --release -p budget --bin prf01-serat-term -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf01-serat-term
          path: bench/out/budgets/
          if-no-files-found: ignore

  # Report-only (task #47): architecture §4.5 states latency *expectations* for the
  # P1 read paths, not budgets, so this job never fails on a slow number. It fails
  # only if it cannot measure. It exists so the numbers are produced on every run and
  # land in an artifact rather than in someone's terminal.
  p1-read-paths:
    name: "FR-NAV-02 / NFR-PRF-03 · P1 read paths and link-resolving saves (report only)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure and print the report
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin p1-read-paths -- --vault 20k | tee bench/out/p1-read-paths.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-read-paths
          path: bench/out/p1-read-paths.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # P1 budgets (tasks #9 and #10; NFR-PRF-08, C-06). The bins already exist on main
  # (#13 p1-tree-path, #14 p1-external-change, #16 p1-switcher); these jobs are what
  # make a breach fail the PR. Three rules shared by the three jobs:
  #
  # * Toolchain: the real pin is rust-toolchain.toml (1.92); cargo honours it whatever
  #   the action installs, so the older jobs on `@stable` are unaffected. These jobs also
  #   spell 1.92 so the installed and the pinned toolchain agree (NFR-PRF-08: a CI number
  #   and a laptop number must be comparable).
  # * Vault: the 20k preset is generated and its digest asserted before anything is
  #   measured, so a drifted generator fails as "wrong vault", not as "slow".
  # * `gate_eligible`: the `environment` step prints whether this runner's number could
  #   be recorded as a gate figure, and the concurrent rustc/link count where the
  #   platform reports it (Windows). It never fails the job and never excuses a breach:
  #   a breach fails whatever the runner. It says how far to trust a *pass* and whether
  #   the number may go in a gate report (docs/05-testing/reports/).
  #
  # Each asserts only its gated figure; what is reported is printed and uploaded.
  # ---------------------------------------------------------------------------

  # FR-VLT-01 (ADR-0015 §3): the complete tree within 2 s p95 at 20k, warm and no-index
  # arms gated separately. This is the Rust side, a LOWER BOUND of the binding
  # tree_complete - T_open: a breach here is a real breach, a pass proves only that this
  # part fits. The in-app interval needs the running webview (task #24) and is not
  # asserted by this job.
  p1-tree-path:
    name: "FR-VLT-01 · file tree complete < 2 s p95 at 20k, Rust-side lower bound (ADR-0015)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-tree-path.env.txt || true
      - name: Measure and assert
        shell: bash
        run: cargo run --release -p budget --bin p1-tree-path -- --vault 20k --assert | tee bench/out/p1-tree-path.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-tree-path
          path: bench/out/p1-tree-path*.txt
          if-no-files-found: ignore

  # FR-VLT-04 (architecture 3.1.2): an external change visible in the index within
  # 500 ms at p95 over 100 single-note changes (PRD v1.9, #81). --assert gates that only;
  # the max and the 100-note batch are printed as "reported, not gated".
  # REPORT-ONLY ON A HOSTED RUNNER (task #165, ruled in #166): on hosted windows-latest
  # (gate_eligible false: the real-time scanner is off) the p95 went 376-615 ms between runs 3 minutes apart with
  # an unchanged 177 ms median, so the bin, still run with --assert, prints REPORT-ONLY and
  # exits 0 there; it exits 1 on a breach where the environment is gate eligible and exits 2 on
  # a failure to measure. The assertion is the reference machine's
  # (docs/05-testing/reports/fr-vlt-04-windows-tail-triage.md).
  p1-external-change:
    name: "FR-VLT-04 · external change visible in the index < 500 ms p95 over 100 single-note changes (report-only on hosted windows; asserted on the reference machine; PRD v1.9; max and 100-file batch reported)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-external-change.env.txt || true
      - name: Measure and assert
        shell: bash
        run: cargo run --release -p budget --bin p1-external-change -- --vault 20k --single 100 --batches 20 --assert | tee bench/out/p1-external-change.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-external-change
          path: bench/out/p1-external-change*.txt
          if-no-files-found: ignore

  # NFR-PRF-06 (architecture 9.2): gated at the binding 50 ms p95 at 20k, on keystroke 3
  # in default mode and in heading mode, each on its own row, with and without history.
  # The 20 ms allocation to Switcher::query is printed as a finding and never fails
  # (9.2: "a finding, not a failure"). 50k and the stress are reported, never gated.
  # In-process, so a lower bound of keystroke-to-paint: a breach is real, a pass proves
  # only that this part fits.
  p1-switcher:
    name: "NFR-PRF-06 · Switcher::query < 50 ms p95 at 20k, default and heading mode (20 ms allocation, 50k, stress reported)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-switcher.env.txt || true
      - name: Measure and assert (20k gates)
        shell: bash
        run: cargo run --release -p budget --bin p1-switcher -- --vault 20k --assert | tee bench/out/p1-switcher.txt
      - name: Report 50k and the stress shapes (never gates)
        shell: bash
        run: cargo run --release -p budget --bin p1-switcher -- --vault 50k | tee bench/out/p1-switcher-50k.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-switcher
          path: bench/out/p1-switcher*.txt
          if-no-files-found: ignore

  # NFR-PRF-08's acceptance criterion is Inspect: "CI configuration review
  # confirms each budget has an asserting job". This job is that review, run
  # automatically, so a budget added to the PRD without a job fails the build
  # rather than waiting for someone to notice.
  #
  # A budget declared `CiAssertion::WhenGateEligible` (NFR-PRF-04, task #166) has a job that
  # reports on a hosted runner and is asserted on the reference machine; the same test
  # requires that job's name to say "report-only" and to name the reference machine, so the
  # category is visible and cannot be entered by accident.
  #
  # It used to be a shell loop over `grep -o 'id: "..."'`, and P0 finding F-30
  # is what that was worth: reformat the field to `id:"x"` and the grep matches
  # nothing, the loop body never runs, and the job exits 0 having reviewed
  # nothing. The job whose entire purpose was catching an unasserted budget was
  # itself unasserted. It is now a Rust test that iterates P0_BUDGETS and reads
  # this file, so it cannot pass vacuously — and it runs in every `cargo test`,
  # not only here.
  every-budget-has-a-job:
    name: "NFR-PRF-08 · every budget has an asserting job"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Budget table matches the PRD, and every budget has a job here
        run: cargo test -p budget --lib

  # NFR-PRF-02 (task #60). REPORT-ONLY, and the name says so: headless Chromium is not
  # gate-eligible (architecture §9.3 -- the figure that gates is a reference-machine run of
  # the real WebView2 binary), so this job reports and never gates. `continue-on-error`
  # keeps a red harness from failing the PR; the summary says what happened. It runs the
  # real gate command (`--project=subject`: unit, then controls, then subject; never
  # `--no-deps`), so a failing control still skips the subject, and the summary says that.
  # The engine version is printed because a figure without one is not a figure (§9.3): a
  # new Chromium (a Playwright bump) re-baselines the controls before any subject figure counts.
  # TODO once runners schedule (RISK-013): this 20-minute job needs only app/ and
  # bench/editor-latency/, but `on:` is workflow-wide; split it out or gate it with a paths filter.
  editor-latency:
    name: "NFR-PRF-02 · editor keystroke-to-paint, headless Chromium (report only, not gate-eligible)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            bench/editor-latency/package-lock.json
      - name: Build the bench bundle
        working-directory: app
        run: |
          npm ci
          npm run build:bench
      - name: Install the harness and Chromium only
        working-directory: bench/editor-latency
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Unit, controls, then subject (about 20 minutes)
        working-directory: bench/editor-latency
        env:
          SERAT_BENCH_DIST: ../../app/dist-bench
          SERAT_SUBJECT_LABEL: "ci @ ${{ github.sha }}"
          SERAT_DUMP_DIR: out/dumps
        # explicit bash: GitHub's default for a bare `run` is `bash -e` WITHOUT pipefail, so the
        # step's status would be tee's and a red control, FAIL or INDETERMINATE would show green.
        # (`--workers=1` repeats the config and changes nothing in rule E0.)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/dumps
          npx playwright test --project=subject --workers=1 2>&1 | tee out/run.log
      - name: Other scenarios and CRLF/BOM variants (task #61; report only, about 35 minutes)
        # Table cell, link-dense paragraph, Enter mid-note, Backspace across a bold delimiter, split-preview
        # typing, and the fixture loaded as CRLF and as BOM+CRLF (architecture 9.3 "Scenarios"). Same controls
        # gate it (it depends on them). `|| true`: a FAIL here is a finding, never a red PR (headless is not
        # gate-eligible); the verdicts are in the log and the artifact.
        working-directory: bench/editor-latency
        env:
          SERAT_BENCH_DIST: ../../app/dist-bench
          SERAT_SUBJECT_LABEL: "ci @ ${{ github.sha }}"
          SERAT_DUMP_DIR: out/dumps
        shell: bash
        run: |
          mkdir -p out/dumps
          npx playwright test --project=scenarios --workers=1 2>&1 | tee out/run-scenarios.log || true
      - name: Summary (engine, positive-strict margin, subject verdicts)
        if: always()
        working-directory: bench/editor-latency
        shell: bash
        run: |
          if [ ! -f out/run.log ]; then
            echo "### NFR-PRF-02 editor latency: the harness did not run (npm ci, build:bench or the Chromium install failed before the tests started)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### NFR-PRF-02 editor latency: headless Chromium, REPORT ONLY (not gate-eligible, architecture 9.3)"
            echo
            echo "Engine: $(grep -m1 '^engine:' out/run.log | cut -c1-150 || true)"
            echo
            echo "Positive controls (bar >= 99% of 300 keys; record 100% on 141, 99.7% on an earlier 153 run, 99.0% on the 2026-11-09 dry run, which is exactly the bar: one more late key rejects the run. The architecture 9.3 margin to watch):"
            echo '```'
            grep -E '^positive ' out/run.log | cut -c1-110 || true
            echo '```'
            echo
            echo "Subject verdicts (3 caret positions x strict and swept cadence = six; INDETERMINATE is not a pass):"
            echo '```'
            grep -E '^SUBJECT ' out/run.log | grep -oE '\[(start|middle|end)\]|(strict|swept) \(caret|verdict [A-Z]+; [0-9.]+% on time' | sed -E 's/ \(caret//' | paste -sd' ' | sed 's/ \[/\n[/g' || true
            echo '```'
            echo
            echo "No SUBJECT lines above means the unit or a control failed first and the subject was skipped; see run.log in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-latency
          path: bench/editor-latency/out/
          if-no-files-found: ignore

  # NFR-PRF-02, the real-IPC arm (task #61). REPORT-ONLY for the same reason as editor-latency. The
  # harness forwards the editor's IPC to a real serat-app AppState over loopback
  # (crates/serat-app/examples/editor_ipc_bridge.rs), so a debounced save and the index work it starts
  # land inside the measured keystrokes. Not included, and the log says so: Tauri's own webview-to-Rust
  # transport. Needs the Tauri Linux build dependencies to build the bridge.
  editor-latency-real-ipc:
    name: "NFR-PRF-02 · editor keystroke-to-paint with real serat-app IPC (report only, not gate-eligible)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            bench/editor-latency/package-lock.json
      - name: Build the bench bundle
        working-directory: app
        run: |
          npm ci
          npm run build:bench
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the IPC bridge
        run: cargo build --example editor_ipc_bridge -p serat-app
      - name: Install the harness and Chromium only
        working-directory: bench/editor-latency
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Controls, then the stub and real IPC arms
        working-directory: bench/editor-latency
        env:
          SERAT_BENCH_DIST: ../../app/dist-bench
          SERAT_IPC_BRIDGE: ${{ github.workspace }}/target/debug/examples/editor_ipc_bridge
          SERAT_SUBJECT_LABEL: "ci @ ${{ github.sha }}"
          SERAT_DUMP_DIR: out/dumps
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/dumps
          npx playwright test --project=real-ipc --workers=1 2>&1 | tee out/run-real-ipc.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-latency-real-ipc
          path: bench/editor-latency/out/
          if-no-files-found: ignore

  # A job skipped because a `needs` failed (build-app failing skips the three
  # app-driving jobs) is reported as skipped, and branch protection treats a skipped
  # required check as passing. This job runs always and is red unless every gating job
  # succeeded, so there is one check to require and it cannot be skipped green. Named
  # `needs.<job>.result` references, as ci.yml's "definition of done" does (F-354: the
  # `needs.*` filter is a schema violation). editor-latency* are report-only and excluded.
  # prf04-full-rebuild IS included but is a report-only job (ADR-0019): green means it measured.
  budgets-gate:
    name: "budgets · every gating job succeeded"
    if: always()
    needs:
      - serat-app-release-guard
      - vault
      - build-app
      - prf04-full-rebuild
      - prf03-save-to-index
      - prf01-cold-start
      - prf01-serat-term
      - p1-read-paths
      - p1-tree-path
      - p1-external-change
      - p1-switcher
      - every-budget-has-a-job
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gating job succeeded
        shell: bash
        run: |
          ok=true
          check() { if [ "$2" != "success" ]; then echo "::error::$1 finished as '$2', not 'success'"; ok=false; fi; }
          check serat-app-release-guard "${{ needs.serat-app-release-guard.result }}"
          check vault "${{ needs.vault.result }}"
          check build-app "${{ needs.build-app.result }}"
          check prf04-full-rebuild "${{ needs.prf04-full-rebuild.result }}"
          check prf03-save-to-index "${{ needs.prf03-save-to-index.result }}"
          check prf01-cold-start "${{ needs.prf01-cold-start.result }}"
          check prf01-serat-term "${{ needs.prf01-serat-term.result }}"
          check p1-read-paths "${{ needs.p1-read-paths.result }}"
          check p1-tree-path "${{ needs.p1-tree-path.result }}"
          check p1-external-change "${{ needs.p1-external-change.result }}"
          check p1-switcher "${{ needs.p1-switcher.result }}"
          check every-budget-has-a-job "${{ needs.every-budget-has-a-job.result }}"
          $ok
