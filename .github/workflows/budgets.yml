# Performance budgets — NFR-PRF-08, US-35, C-06.
#
# "Every performance budget shall be asserted in continuous integration; a
# regression shall fail the build." One job per budget, so a failure names the
# requirement it broke instead of saying "benchmarks failed".
#
# These jobs cannot currently run at all, and it is not the reason this header
# used to give. Rebuild (I4), the incremental save path (I5) and the application
# (D2, S1) all exist on main now — the blocker is F-384: ci.yml and budgets.yml
# stopped being scheduled runner-side on 2026-09-06 (every run since completes in
# 1-4s with zero steps, consistent with exhausted included Actions minutes on this
# private repo), and that needs the repository owner, not a code change. A budget
# job that skips when the thing it measures is absent is worse than no job at
# all: the build goes green and nobody notices the budget is unasserted. Each job
# still prints exactly which task unblocks it, for whichever failure mode is live
# when it next actually runs.
#
# Owner: test-engineer. Thresholds live in bench/budget/src/lib.rs next to the
# requirement they come from, and are never weakened to make a build pass — a
# budget that is genuinely wrong is re-baselined in the PRD (task Q1) with the
# measurement attached.

name: budgets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A budget measured in a debug build is not a measurement.
  #
  # RULE: release builds are per package (`-p`), NEVER `--workspace`. budget links
  # serat-index with its `test-hooks` feature, and a workspace-wide build unifies
  # that feature into serat-app, whose const assert (crates/serat-app/src/lib.rs)
  # then refuses to compile a release build carrying test hooks. Debug is
  # unaffected. Every command in this file is already `-p`-scoped; keep it so. The
  # `serat-app-release-guard` job below exercises the guard (task #54, NFR-MNT-01).
  CARGO_PROFILE: release

jobs:
  # The test-hooks guard, exercised: serat-app built alone in release must compile,
  # i.e. nothing in ITS graph turns `test-hooks` on. If someone adds the feature to
  # serat-app's own dependency edge, this fails here rather than at release time.
  # Independent of `vault`, cheap, and runs on every PR and every push to main.
  serat-app-release-guard:
    name: "serat-app builds in release without test-hooks"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p serat-app --release
      # The other direction: with test-hooks forced on, the same build MUST fail, and
      # fail on the guard's own message (not on some unrelated error). If this step
      # passes the assert is dead and the first step proves nothing.
      - name: The guard fires when test-hooks is unified in
        shell: bash
        run: |
          if out=$(cargo check -p serat-app --release --features serat-index/test-hooks 2>&1); then
            echo "$out"
            echo "::error::serat-app built in release with test-hooks on; the const assert is not firing"
            exit 1
          fi
          echo "$out" | grep -q "test-hooks must not reach a release build" || {
            echo "$out"
            echo "::error::the build failed, but not on the test-hooks guard"
            exit 1
          }

  # NFR-MNT-02: the vault is generated from one command and is byte-identical.
  # Everything below is measured against it, so if this fails the other jobs
  # are measuring something unknown and are not worth running.
  vault:
    name: "NFR-MNT-02 · benchmark vault is deterministic"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault
        run: cargo run --release -p vaultgen -- --preset 20k --force
      - name: Regenerate and assert the digest is unchanged
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Generator tests
        run: cargo test --release -p vaultgen

  prf04-full-rebuild:
    name: "NFR-PRF-04 · full rebuild of 20k notes < 30 s"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p budget --bin prf04-full-rebuild -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf04-full-rebuild
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf03-save-to-index:
    name: "NFR-PRF-03 · save to index < 50 ms p95 over 1000 saves"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p budget --bin prf03-save-to-index -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf03-save-to-index
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf01-cold-start:
    name: "NFR-PRF-01 · scale independence on the Serat term; the two aggregates reported"
    # Task #118 landed: the PRD is the source of truth for what is gated, and
    # PRD v1.2 gates only the Serat term for NFR-PRF-01 (prf01-serat-term,
    # below). window_visible and vault_usable are measured, validated, printed
    # and uploaded by this job and gate nothing -- F-407 measured the aggregate
    # moving ~19% batch-to-batch against ~8% for the Serat term, so it cannot
    # decide a pass at any threshold, and F-443 is the gap between that fact
    # and what CI used to assert.
    #
    # This job is still required, and not as a formality: architecture §3.4's
    # scale-independence check is its remaining assertion, and it fails the
    # build. §3.4's #118 ruling moved that check's subject from
    # window_visible_ms to the Serat term and kept the job here, because
    # prf01-serat-term is a second reduction of one batch of traces while this
    # is a second measurement -- two vaults, interleaved, with the 50,000-note
    # fixture in it (F-446). Removing this job would silently delete the only
    # assertion that vault size does not move the critical path.
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p budget --bin prf01-cold-start -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf01-cold-start
          path: bench/out/budgets/
          if-no-files-found: ignore

  prf01-serat-term:
    name: "NFR-PRF-01 · Serat term < 350 ms p95 (task #104's binding gate)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p budget --bin prf01-serat-term -- --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prf01-serat-term
          path: bench/out/budgets/
          if-no-files-found: ignore

  # Report-only (task #47): architecture §4.5 states latency *expectations* for the
  # P1 read paths, not budgets, so this job never fails on a slow number. It fails
  # only if it cannot measure. It exists so the numbers are produced on every run and
  # land in an artifact rather than in someone's terminal.
  p1-read-paths:
    name: "FR-NAV-02 / NFR-PRF-03 · P1 read paths and link-resolving saves (report only)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure and print the report
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin p1-read-paths -- --vault 20k | tee bench/out/p1-read-paths.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-read-paths
          path: bench/out/p1-read-paths.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # P1 budgets (tasks #9 and #10; NFR-PRF-08, C-06). The bins already exist on main
  # (#13 p1-tree-path, #14 p1-external-change, #16 p1-switcher); these jobs are what
  # make a breach fail the PR. Three rules shared by the three jobs:
  #
  # * Toolchain: the real pin is rust-toolchain.toml (1.92); cargo honours it whatever
  #   the action installs, so the older jobs on `@stable` are unaffected. These jobs also
  #   spell 1.92 so the installed and the pinned toolchain agree (NFR-PRF-08: a CI number
  #   and a laptop number must be comparable).
  # * Vault: the 20k preset is generated and its digest asserted before anything is
  #   measured, so a drifted generator fails as "wrong vault", not as "slow".
  # * `gate_eligible`: the `environment` step prints whether this runner's number could
  #   be recorded as a gate figure, and the concurrent rustc/link count where the
  #   platform reports it (Windows). It never fails the job and never excuses a breach:
  #   a breach fails whatever the runner. It says how far to trust a *pass* and whether
  #   the number may go in a gate report (docs/05-testing/reports/).
  #
  # Each asserts only its gated figure; what is reported is printed and uploaded.
  # ---------------------------------------------------------------------------

  # FR-VLT-01 (ADR-0015 §3): the complete tree within 2 s p95 at 20k, warm and no-index
  # arms gated separately. This is the Rust side, a LOWER BOUND of the binding
  # tree_complete - T_open: a breach here is a real breach, a pass proves only that this
  # part fits. The in-app interval needs the running webview (task #24) and is not
  # asserted by this job.
  p1-tree-path:
    name: "FR-VLT-01 · file tree complete < 2 s p95 at 20k, Rust-side lower bound (ADR-0015)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-tree-path.env.txt || true
      - name: Measure and assert
        shell: bash
        run: cargo run --release -p budget --bin p1-tree-path -- --vault 20k --assert | tee bench/out/p1-tree-path.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-tree-path
          path: bench/out/p1-tree-path*.txt
          if-no-files-found: ignore

  # FR-VLT-04 (architecture 3.1.2): an external change visible in the index within
  # 500 ms. --assert gates p95 of the single-note shape only (max is printed, not gated;
  # the PRD names no percentile, #81); the 100-note batch is printed as
  # "reported, not gated".
  p1-external-change:
    name: "FR-VLT-04 · external change visible < 500 ms, single note, gated on p95 (PRD criterion carries no percentile, see #81)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-external-change.env.txt || true
      - name: Measure and assert
        shell: bash
        run: cargo run --release -p budget --bin p1-external-change -- --vault 20k --single 100 --batches 20 --assert | tee bench/out/p1-external-change.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-external-change
          path: bench/out/p1-external-change*.txt
          if-no-files-found: ignore

  # NFR-PRF-06 (architecture 9.2): gated at the binding 50 ms p95 at 20k, on keystroke 3
  # in default mode and in heading mode, each on its own row, with and without history.
  # The 20 ms allocation to Switcher::query is printed as a finding and never fails
  # (9.2: "a finding, not a failure"). 50k and the stress are reported, never gated.
  # In-process, so a lower bound of keystroke-to-paint: a breach is real, a pass proves
  # only that this part fits.
  p1-switcher:
    name: "NFR-PRF-06 · Switcher::query < 50 ms p95 at 20k, default and heading mode (20 ms allocation, 50k, stress reported)"
    needs: vault
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Generate the 20k vault and assert its digest
        run: cargo run --release -p vaultgen -- --preset 20k --force --expect 35fcb867759df4b8737af8914f798d81d77396dfe051f38140139d3779bd393e
      - name: Measurement environment and gate_eligible
        shell: bash
        run: |
          mkdir -p bench/out
          cargo run --release -p budget --bin environment | tee bench/out/p1-switcher.env.txt || true
      - name: Measure and assert (20k gates)
        shell: bash
        run: cargo run --release -p budget --bin p1-switcher -- --vault 20k --assert | tee bench/out/p1-switcher.txt
      - name: Report 50k and the stress shapes (never gates)
        shell: bash
        run: cargo run --release -p budget --bin p1-switcher -- --vault 50k | tee bench/out/p1-switcher-50k.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-switcher
          path: bench/out/p1-switcher*.txt
          if-no-files-found: ignore

  # NFR-PRF-08's acceptance criterion is Inspect: "CI configuration review
  # confirms each budget has an asserting job". This job is that review, run
  # automatically, so a budget added to the PRD without a job fails the build
  # rather than waiting for someone to notice.
  #
  # It used to be a shell loop over `grep -o 'id: "..."'`, and P0 finding F-30
  # is what that was worth: reformat the field to `id:"x"` and the grep matches
  # nothing, the loop body never runs, and the job exits 0 having reviewed
  # nothing. The job whose entire purpose was catching an unasserted budget was
  # itself unasserted. It is now a Rust test that iterates P0_BUDGETS and reads
  # this file, so it cannot pass vacuously — and it runs in every `cargo test`,
  # not only here.
  every-budget-has-a-job:
    name: "NFR-PRF-08 · every budget has an asserting job"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Budget table matches the PRD, and every budget has a job here
        run: cargo test -p budget --lib
