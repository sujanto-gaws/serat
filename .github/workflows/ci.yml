# Task #55 bisection probe (test-engineer): minimal ci.yml with the dynamic
# matrix (members/crate) and the gate job's needs.*.result filter both
# removed, to test whether either of those two least-common constructs is
# what makes every real ci.yml run complete in 0 seconds with 0 jobs.
# Temporary -- restored (or fixed for real) once this answers the question.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace --all-targets -- -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  workspace:
    name: cargo test --workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  location-independence:
    name: the suite passes outside the repository root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the workspace suite from a git worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.email ci@example.invalid
          git config user.name ci
          git worktree add .worktrees/ci HEAD
          cd .worktrees/ci
          cargo test --workspace
      - name: Run the workspace suite from a copy outside the repository
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/serat-elsewhere"
          rm -rf "$dest"
          mkdir -p "$dest"
          tar --exclude=./.git --exclude=./target --exclude=./.worktrees -cf - . \
            | (cd "$dest" && tar -xf -)
          cd "$dest"
          cargo test --workspace

  gate:
    name: definition of done
    needs: [fmt, clippy, workspace, location-independence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, " ") }}'
          echo "upstream results: ${results}"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "definition of done not met: an upstream job reported '${r}'"
              exit 1
            fi
          done
