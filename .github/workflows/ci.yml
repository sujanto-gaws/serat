# The three commands the definition of done names (CLAUDE.md), run on every push.
#
# Task B3. Serves NFR-MNT-01 and C-06's spirit; the performance budgets have
# their own workflow in budgets.yml, one job per budget (NFR-PRF-08).
#
# Owner: test-engineer.
#
# Three things here are deliberate and easy to mistake for over-engineering:
#
# 1. `workspace` and `crate` both run the tests. The workspace run is the gate
#    the definition of done names. The per-crate matrix exists because a
#    workspace-wide gate couples every teammate's completion to every other
#    teammate's crate compiling at that instant — P0 finding F-07 says the real
#    cost of this project so far has been coordination, not Rust, and this is
#    one of the places that cost shows up. When the workspace job is red, the
#    matrix says whose crate it is without anyone reading a log.
#
# 2. `location-independence` runs the same suite from a git worktree. It exists
#    because a real defect shipped that way: the dependency-rule check matched
#    the substring ".worktrees" anywhere in an absolute path, so it passed at
#    the repository root and failed one directory over, in exactly the layout
#    coding-standards.md tells every teammate to use. A suite whose result
#    depends on which directory it ran in is a measurement that reports success
#    because of where it was taken rather than what it measured — which is the
#    class of defect this whole harness exists to prevent. CI is where "it
#    passes on my machine" is supposed to die.
#
# 3. The crate matrix is derived from `cargo metadata`, not typed out. A hand-
#    written list of members drifts silently the first time somebody adds a
#    crate, and a matrix that quietly stops covering a crate is worse than no
#    matrix.
#
# A fourth thing, found while rebasing this branch onto the main serat-app
# landed on: every ubuntu-latest job that compiles the workspace now compiles
# serat-app, and Tauri v2 needs webkit2gtk and friends from apt to link on
# Linux — nothing in this repository (dev-setup.md included) says so yet,
# because this branch was cut before serat-app existed. Added below rather
# than left for the first Linux CI run to discover as a red build with an
# unhelpful linker error.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Task #41: licences, advisories, duplicate versions, wildcards and sources, per deny.toml.
  # NFR-SEC-01, NFR-MNT-01, NFR-PRF-08. It fails its own check (continue-on-error: false) and, since
  # #113 (#112 fixed RUSTSEC-2026-0459), is in gate.needs and the results loop. The action is to be pinned to a patch tag or SHA once runners schedule. It is currently
  # pinned to the v2 major tag (its own line of releases; the exact patch tag could not be
  # verified from the authoring sandbox, so tighten it to a patch tag when runners schedule).
  deny:
    name: cargo deny check (licences, advisories, bans, sources)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The container must honour rust-toolchain.toml (1.92); not verifiable offline.
          rust-version: "1.92"
          arguments: --workspace

  clippy:
    name: cargo clippy --workspace --all-targets -- -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  workspace:
    name: cargo test --workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the reference machine's platform and the one the P0 numbers
        # come from; Linux is what CI would otherwise only ever see. Serat ships
        # on macOS too (FR-PLT-01), and that runner joins when packaging does —
        # adding it now would buy a third copy of the same failure.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Task #77: the Windows-only checks, listed by name so a runner's log shows each one
      # (`--nocapture` prints the SKIPPED lines of the tests that skip themselves: no
      # administrative share, no `subst`, no symlink privilege, 8.3 names off). They are
      # `cfg(windows)` and do not exist on Linux, which is the documented skip. Ready,
      # awaiting a runner (F-384): written by reading the APIs, never executed.
      #   crates/serat-app/tests/windows_vault.rs
      #     a_verbatim_root_opens_as_the_plain_form_with_one_identity
      #     a_unc_root_opens_as_a_unc_form_not_the_mangled_one
      #     a_mapped_drive_root_is_the_same_vault_as_the_directory_behind_it
      #     a_drive_relative_root_that_names_nothing_is_an_error
      #     the_walk_lists_what_ntfs_allows_and_reports_what_win32_would_refuse
      #     relativise_refuses_what_ntfs_stores_and_win32_would_not_create
      #     (ignored, need OneDrive: stat_paths_do_not_hydrate_a_placeholder,
      #      reading_a_placeholder_is_reported_not_silent)
      #   crates/serat-app/src/asset/tests.rs, module windows_only
      #     a_junctioned_directory_component_is_refused
      #     the_handle_check_alone_catches_a_component_swapped_for_a_junction
      #     a_directory_swapped_for_a_junction_into_serat_is_refused_by_step_7
      #     an_8_3_short_name_for_dot_serat_is_refused_by_step_7
      #     a_final_component_symlink_to_outside_is_refused_by_the_handle_check
      #     an_alternate_data_stream_name_is_refused
      #     a_file_inside_the_root_opens_although_the_handle_path_is_verbatim
      - name: Windows-only checks (vault roots, NTFS names, asset handle checks)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # A test that cannot run on this runner (no administrative share, no `subst`, no
          # symlink privilege, 8.3 names off) fails instead of printing SKIPPED and passing.
          SERAT_WINDOWS_STRICT: "1"
        run: |
          set -euo pipefail
          cargo test -p serat-app --test windows_vault -- --nocapture
          cargo test -p serat-app --lib asset::tests::windows_only -- --nocapture

  # Task #77: the Windows-only code compiles, from Linux, under the same `-D warnings`. A
  # `cfg(windows)` body is otherwise first compiled on the Windows runner; this found two
  # dead-code errors that would have failed that leg. Gating since #194 (NFR-CMP-01,
  # NFR-MNT-01): ci run 462 (0a4b3fe) was its first green run on main and run 463 (8f01d7b)
  # was green too, so it is in gate.needs and the results loop like deny (#113).
  windows-compile:
    name: windows code compiles (x86_64-pc-windows-gnu, check only)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Install a MinGW toolchain (C compiler and windres for build scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      # @1.92, not @stable: rust-toolchain.toml selects 1.92, so cargo runs that toolchain and
      # `@stable` installed the windows-gnu target for a toolchain cargo never used ("can't find
      # crate for std: the x86_64-pc-windows-gnu target may not be installed", task #191).
      - uses: dtolnay/rust-toolchain@1.92
        with:
          targets: x86_64-pc-windows-gnu
      # Run #460 (after #191) still failed with the same "can't find crate for std": the
      # action's `targets:` did not reach the toolchain cargo resolves in the repo. rustup run
      # from the repo root honours rust-toolchain.toml, so add the target there, explicitly;
      # `rustup show` prints which toolchain and targets that resolves to (diagnostic).
      - name: Add the windows-gnu target to the toolchain rust-toolchain.toml selects (#193)
        run: |
          rustup target add x86_64-pc-windows-gnu
          rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target x86_64-pc-windows-gnu --workspace --tests

  # Task #119: the npm half of NFR-SEC-07 (US-42, NFR-PRF-08): app/'s dependencies are audited,
  # licence-checked and registry-only, per /npm-deny.json (the npm counterpart of deny.toml).
  # The self-test plants a failure in each check first, so a policy script that has gone blind
  # fails here rather than passing everything. `npm audit` is the only step that needs the
  # network (the registry's advisory endpoint); licences and sources read package-lock.json.
  npm-deny:
    name: npm audit, licences, sources (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test the policy script
        run: node --test bench/npm-deny/npm-deny.test.mjs
      - name: Apply npm-deny.json to app/package-lock.json
        run: node bench/npm-deny/npm-deny.mjs all

  # Task #27: the generated TypeScript IPC types are current (NFR-MNT-01, ADR-0007).
  # serat-app's docs say "CI regenerates and fails on a diff"; until this job nothing did.
  # The contracts crate is the generator of record and needs no Tauri system libraries.
  # `git status --porcelain` rather than `git diff` so a file the generator adds, which is
  # untracked, fails the job as well as one it changes. A file the generator no longer
  # emits shows as a deletion.
  ipc-types:
    name: generated IPC types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate into app/src/ipc/generated and require no change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/ipc/generated
          (cd contracts && TS_RS_EXPORT_DIR=../app/src/ipc/generated cargo test -p serat-contracts)
          changed=$(git status --porcelain -- app/src/ipc/generated)
          if [ -n "$changed" ]; then
            echo "generated IPC types are stale; regenerate and commit:"
            echo "$changed"
            exit 1
          fi

  # Task #136 (NFR-MNT-01, NFR-PRF-08, NFR-SEC-01; ADR-0007, ADR-0017, C-06; F-470): the committed
  # webview bundle is what `npm run build` produces from app/. `crates/serat-app/tauri.conf.json`
  # has `frontendDist: "webview"` and no `beforeBuildCommand`, so the bundle is compiled into the
  # binary and `cargo build` never runs vite: a bundle that has drifted from app/src fails nothing,
  # and every front-end check (paint marks, CSP, any mutation of app/src) measures the old one and
  # reports clean (F-470). Task #116 rebuilt it in production mode; this job keeps it so.
  # vite builds straight into that directory, so a bundle in sync leaves the tree clean.
  # The directory is deleted first, so if vite's outDir ever stops being the shipped directory the
  # build writes elsewhere, the files are missing, and the check fails instead of passing vacuously
  # (the old branch needed a separate Rust pin for that). `git status --porcelain` rather than
  # `git diff` so a file the build adds, which is untracked, fails as well as one it changes.
  frontend-bundle:
    name: committed webview bundle matches app/ source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The minor is pinned: the bundle is compared byte for byte, so a new Node minor
          # on the runner must not be able to change it silently. Bump with the lockfile.
          node-version: "22.23"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exactly what the lockfile says
        run: npm ci
        working-directory: app
      - name: Rebuild the bundle over an empty directory and require no change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf crates/serat-app/webview
          (cd app && NODE_ENV=production npm run build)
          changed=$(git status --porcelain -- crates/serat-app/webview)
          if [ -n "$changed" ]; then
            echo "the committed bundle in crates/serat-app/webview is not what app/ source builds:"
            echo "$changed"
            echo "rebuild and commit it: cd app && npm ci && NODE_ENV=production npm run build"
            echo "until then the binary ships the OLD bundle and downstream front-end checks measure it (F-470)."
            exit 1
          fi

  # The member list, read from cargo rather than typed out, so the matrix below
  # cannot drift away from the workspace.
  members:
    name: enumerate workspace members
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          names=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[].name] | sort')
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "matrix will cover: ${names}"

  crate:
    name: cargo test -p ${{ matrix.crate }}
    needs: members
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.members.outputs.names) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ${{ matrix.crate }} --all-targets

  location-independence:
    name: the suite passes outside the repository root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A worktree needs real history; the default shallow clone has none.
          fetch-depth: 0
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the workspace suite from a git worktree
        shell: bash
        run: |
          set -euo pipefail
          # Reproduces the layout coding-standards.md mandates: every teammate
          # works in .worktrees/<role>, and a check that only holds at the
          # repository root would be broken for all of them and green here.
          git config user.email ci@example.invalid
          git config user.name ci
          git worktree add .worktrees/ci HEAD
          cd .worktrees/ci
          cargo test --workspace
      - name: Run the workspace suite from a copy outside the repository
        shell: bash
        run: |
          set -euo pipefail
          # A worktree still lives under the repository. A plain copy elsewhere
          # catches anything that depends on the repository root being an
          # ancestor at all — an absolute path baked into a test, say.
          dest="${RUNNER_TEMP}/serat-elsewhere"
          rm -rf "$dest"
          mkdir -p "$dest"
          # -a would drag .git and the worktree along with it.
          tar --exclude=./.git --exclude=./target --exclude=./.worktrees -cf - . \
            | (cd "$dest" && tar -xf -)
          cd "$dest"
          cargo test --workspace

  # CLAUDE.md's definition of done names three commands. This job is the single
  # required check: it is green only when all of them are, across every matrix
  # leg, so a branch protection rule has one thing to point at.
  #
  # Task #55, F-354: `needs.*.result` -- GitHub Actions' object-filter syntax,
  # documented for arrays -- is what made every run of this workflow complete
  # in 0 seconds with 0 jobs, across its entire history, on both push and
  # pull_request. `needs` is a map keyed by job id, not an array, so the
  # filter is a schema violation GitHub's validator rejects at parse time,
  # before a single job is scheduled -- invisible to `pyyaml` (which only
  # checks YAML, not the Actions expression grammar inside `${{ }}` strings)
  # and invisible to a human reading a workflow that "looks" like every other
  # working use of `needs.*`. Bisected by pushing a minimal version of this
  # file with jobs added back one at a time (this exact job was the only one
  # that reintroduced the failure) rather than guessing from the YAML alone.
  # Named references below, the documented and unambiguous way to read a
  # `needs` result.
  gate:
    name: definition of done
    needs: [fmt, clippy, workspace, crate, location-independence, deny, ipc-types, npm-deny, frontend-bundle, windows-compile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        shell: bash
        run: |
          set -euo pipefail
          fmt_result='${{ needs.fmt.result }}'
          clippy_result='${{ needs.clippy.result }}'
          workspace_result='${{ needs.workspace.result }}'
          crate_result='${{ needs.crate.result }}'
          li_result="${{ needs['location-independence'].result }}"
          deny_result='${{ needs.deny.result }}'
          ipc_result="${{ needs['ipc-types'].result }}"
          npm_result="${{ needs['npm-deny'].result }}"
          bundle_result="${{ needs['frontend-bundle'].result }}"
          winc_result="${{ needs['windows-compile'].result }}"
          results="$fmt_result $clippy_result $workspace_result $crate_result $li_result $deny_result $ipc_result $npm_result $bundle_result $winc_result"
          echo "upstream results: ${results}"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "definition of done not met: an upstream job reported '${r}'"
              exit 1
            fi
          done
