[package]
name = "serat-vault"
description = "Watching, reading, atomic writes, ignore rules, path canonicalisation. Knows nothing about Markdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serat-core = { workspace = true }
blake3 = { workspace = true }
notify = { workspace = true }

# Windows file identity (volume serial + file index) for `FileIdentity`; the handle it
# opens is dropped at once. Already in the tree through `same-file`.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Test seams other crates need (`Vault::with_platform`). Enabled only from
# dev-dependencies; serat-app asserts it is absent from a release build.
test-hooks = []
# Per-phase wall-clock marks in the write path (`phases`), for the benchmarks only (task
# #172). Off, every mark compiles to nothing. Unlike `test-hooks` it changes no behaviour,
# so serat-app does not assert it away.
phase-timing = []

[lints]
workspace = true
