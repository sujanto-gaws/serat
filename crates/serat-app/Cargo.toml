[package]
name = "serat-app"
description = "The Tauri shell: commands, events, wiring. No domain logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "serat"

# The binary the cold-start budget spawns (NFR-PRF-01). Named `serat` rather than
# `serat-app` because bench/budget/src/subject.rs spells it `serat.exe`.
[[bin]]
name = "serat"
path = "src/main.rs"

[lib]
name = "serat_app"
path = "src/lib.rs"

[dependencies]
# Every capability comes from a crate that owns it (architecture §2.1). serat-app
# adds none of its own.
serat-core = { workspace = true }
serat-vault = { path = "../serat-vault" }
serat-index = { path = "../serat-index" }
# The only production NoteParser (task I3): open_or_rebuild (task #65) needs one to
# drive a rebuild, and serat-app owns no parsing logic of its own.
serat-parse = { path = "../serat-parse" }

serde = { workspace = true }
serde_json = { workspace = true }

# Pinned here rather than in [workspace.dependencies] because serat-app is their only
# consumer: the workspace table exists so two crates cannot resolve different majors
# of the same crate, and there is no second crate to disagree with.
tauri = { version = "2.11.5", features = ["custom-protocol"] }
# ADR-0007: the front-end types are generated from the contract, never hand-written.
ts-rs = "12.0.1"
# Settings live in a TOML file in the platform config directory (§3.4, first row of
# the cold-start table). `dirs` is what knows where that is on three platforms.
toml = "1.1.5"
dirs = "6.0.0"
# §9.3: opening an external link, a mailto link or (P2) a PDF's internal link
# goes through the system opener, never a webview navigation (T-09). Scoped to
# exactly http/https/mailto in capabilities/default.json -- narrower than the
# plugin's own `default` permission set, which also grants `tel:` -- task #37.
tauri-plugin-opener = "2.5.5"

# Task #37: WebKitGTK's own `context-menu` signal is how the default
# right-click menu is cancelled in release builds (nav_guard.rs); Tauri's
# `PlatformWebview::inner()` already returns this exact type, so this pins
# the version rather than adding a new API surface. Windows and macOS need
# their own platform crates for the same job and are not implemented yet
# (nav_guard.rs's doc comment) -- so there is nothing to add here for them.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# task #89: verifying the save path reaches the index means reading `.serat/index.db`
# with something that is not this crate's own reader, the way task #65's own
# end-to-end check did -- a bug in the wiring must not also be able to hide the
# assertion that would catch it. Dev-only: no production code opens the database
# directly (§2.1 -- that is serat-index's job).
[dev-dependencies]
rusqlite = { workspace = true }
# Test fixtures that clean up after themselves.
tempfile = { workspace = true }

# `tauri`'s "test" feature (`tauri::test`, `MockRuntime`) is a target-specific
# dev-dependency rather than a plain one: `tests/acl_behaviour.rs` is
# `#[cfg(not(windows))]`'d out (task #53, F-345 -- the OS loader crashes on this
# feature's runtime-wry/webview2 linkage before any Rust code runs, which
# `#[ignore]` cannot prevent), so there is no reason for a Windows dev build to
# compile the mock runtime in at all.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2.11.5", features = ["custom-protocol", "test"] }

[lints]
workspace = true
