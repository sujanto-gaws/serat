# cargo-deny policy. Task #41. Serves NFR-SEC-01 (no telemetry / no unreviewed network
# dependency enters the tree), NFR-MNT-01 (the dependency tree is knowable and checked), NFR-PRF-08
# (a CI gate, not a convention). Owner: test-engineer; licence additions are the lead's call.
#
# Run: `cargo deny --workspace check` (CI job `deny` in .github/workflows/ci.yml).

[graph]
# Every target Serat ships on, so a licence or advisory that only exists on one platform's
# dependencies (windows-sys on Windows, gtk on Linux, objc2 on macOS) is still seen.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Vulnerabilities are always errors in cargo-deny >= 0.15; unmaintained crates are denied for
# every crate in the graph, not only direct dependencies; yanked is a warning.
unmaintained = "all"
yanked = "warn"
# Each entry below is an UNMAINTAINED notice (no vulnerability) in a crate reached only through
# Tauri / wry / zbus, which Serat cannot upgrade (C-07); each is an explicit, reviewed exception
# rather than a loosened policy, and is removed when Tauri moves off the crate. There is NO
# ignore for any vulnerability: RUSTSEC-2026-0459 (libsqlite3-sys) is left failing on purpose.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-macros/glib-macros (tauri, Linux); no safe upgrade" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via urlpattern (tauri-utils); no safe upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via urlpattern (tauri-utils); no safe upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via urlpattern (tauri-utils); no safe upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via urlpattern (tauri-utils); no safe upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via urlpattern (tauri-utils); no safe upgrade" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus (tauri-plugin-opener, Linux); no safe upgrade" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus (tauri-plugin-opener, Linux); no safe upgrade" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus (tauri-plugin-opener, Linux); no safe upgrade" },
]

[licenses]
confidence-threshold = 0.93
# The allow-list is what `cargo deny list` found in the tree on 2026-11-09, minus anything
# copyleft. All are permissive. Anything new fails the build and goes to the lead.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# Not allowed, and present in the tree only as one arm of an OR expression: LGPL-2.1-or-later
# (r-efi, "MIT OR Apache-2.0 OR LGPL-2.1-or-later"), which the MIT arm satisfies.

[bans]
# Duplicate versions are WARN: the tree has many (windows-sys, syn, toml, thiserror ... through
# tauri); see the task #41 report. Promote to deny when the tree is clean.
multiple-versions = "warn"
wildcards = "deny"
# Workspace members with `path` dependencies are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
